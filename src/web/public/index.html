<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Engage · Panel de control</title>
    <link rel="icon" href="/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <div id="app" class="app is-loading">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <div class="brand">
          <img src="/img/logo.svg" alt="" width="32" height="32" />
          <div>
            <strong>Engage</strong>
            <span>Panel de control</span>
          </div>
        </div>
        <div class="guild-switch" id="guild-switch"></div>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot" id="user-box"></div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>
      <main class="main">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="menu-btn" aria-label="Abrir menú"></button>
          <div class="topbar-title">
            <h1 id="page-title">Cargando…</h1>
            <p id="page-sub"></p>
          </div>
          <div class="topbar-actions" id="topbar-actions"></div>
        </header>
        <div id="banner"></div>
        <section class="view" id="view" tabindex="-1"></section>
      </main>
    </div>
    <div id="login" class="login" hidden></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
    <div class="tooltip" id="chart-tip" role="tooltip" hidden></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
